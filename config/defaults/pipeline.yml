## MetaManifold factory defaults
## Every pipeline option carries a default here; a study, group, or run
## pipeline.yml overrides only the keys it names, cascading over these.
## Values are deliberately generic; tune read-length and locus-specific numbers
## (truncation lengths, primers, expected errors) per dataset in a project file.

## Identity and reproducibility
# Master random seed for every stochastic step (subsampling, DADA2, rarefaction)
# so a run reproduces exactly.
seed: 123
# Subsample this many reads per sample before processing; 0 uses all reads.
subsample_n: 0
# Pool a run's child sub-directories as one denoising batch when true.
pool_children: false

## Compute
# Worker threads for every DADA2 R stage - learn_errors, denoise,
# chimera_removal and assign_taxonomy all read this one key. `true` lets DADA2
# use every core it can see, a positive integer pins the count, `false` runs
# single-threaded. DADA2 threads these stages with RcppParallel (in-process TBB
# workers), not by forking, so raising this is safe inside the embedded R
# session; see the BiocParallel note in dada2/dada2_functions.r for why forking
# is not.
#
# filter_trim is deliberately excluded: dada2::filterAndTrim only honours
# `multithread` by switching off its own OpenMP path and forking through
# mcmapply, which is exactly the deadlock that note describes. It stays on OMP.
r_threads: 4

## Remote execution (bioserver)
# DISCLAIMER: you are solely responsible for ensuring you are authorised to use
# the host you configure here, and to place sequencing data on it. This project
# opens an SSH connection to whatever `host` names and copies the inputs of the
# listed stages there; it makes no check of who owns that machine or of what
# policy governs the data.
#
# Offload individual DADA2 stages to a compute server over SSH. Each stage
# ships its own inputs and collects its own outputs, so any stage can run
# remotely whether or not the stage before it did: a run denoised locally can
# still have its chimeras removed on the server, and vice versa.
remote:
  # SSH destination, e.g. "user@host". ~ keeps every stage local.
  host: ~
  # Rscript on the server; a bare name is resolved against the login PATH.
  rscript: "Rscript"
  # Absolute directory on the server for per-run staging. Each stage creates a
  # fresh subdirectory under it and removes it again when the stage finishes.
  staging_dir: "/absolute/path/on/server"
  # SSH private key; ~ falls back to the agent, then to a password prompt.
  identity_file: ~
  # Threads to request on the server; ~ uses r_threads for DADA2 and
  # phylogeny.threads for the phylogeny steps.
  threads: ~
  # Stages to run on the server. Any of: learn_errors, denoise,
  # chimera_removal, assign_taxonomy, phylogeny_align (MAFFT for a reference
  # tree), phylogeny_tree (IQ-TREE), phylogeny_add (MAFFT --addfragments for a
  # placement), phylogeny_place (RAxML). The rest stay local.
  stages: []
  # Programs the phylogeny steps call on the server; a bare name is resolved
  # against the login PATH.
  tools:
    mafft: "mafft"
    iqtree: "iqtree"
    raxml: "raxmlHPC-PTHREADS-SSE3"

## Primer trimming (cutadapt)
cutadapt:
  # Filename markers that distinguish the forward and reverse read files.
  r1_suffix: "_R1"
  r2_suffix: "_R2"
  # Maximum error rate cutadapt tolerates when matching a primer; ~ uses the
  # cutadapt default (0.1).
  error_rate: ~
  # Named primer pairs to trim, resolved against config/primers.
  primer_pairs:
    - "EMP"
  # Drop read pairs in which no primer was found.
  discard_untrimmed: true
  # Worker processes; 0 lets cutadapt choose.
  cores: 0
  # Discard reads shorter than this after trimming.
  min_length: 200
  # Extra raw cutadapt flags appended verbatim (shell-metacharacter checked).
  optional_args: ""
  # Minimum primer/read overlap to call a match; ~ uses the cutadapt default.
  overlap: ~
  # Quality-trim read ends below this Phred score; ~ disables it.
  quality_cutoff: ~

## Denoising and taxonomy (DADA2)
dada2:
  # Emit progress logging from the R worker.
  verbose: true
  file_patterns:
    # Read layout: paired, forward, or reverse.
    mode: "paired"
  filter_trim:
    # Discard reads shorter than this after truncation.
    min_len: 175
    # Require matched forward/reverse read IDs.
    match_ids: true
    # Remove PhiX spike-in reads.
    rm_phix: true
    # Trim read ends once quality falls to this Phred score.
    trunc_q: 2
    # Truncate forward/reverse reads to these lengths; tune per amplicon.
    trunc_len:
      - 220
      - 220
    # Expected-error ceiling per forward/reverse read.
    max_ee:
      - 3
      - 3
  dada:
    # Self-consistency iterations for error learning.
    max_consist: 15
    # Sample pooling for denoising: none, pseudo, or true.
    pool_method: "pseudo"
    # Bases sampled when learning the error model.
    nbases: 200000000
  merge:
    # Mismatches tolerated in the forward/reverse overlap.
    max_mismatch: 0
    # Minimum overlap to merge a pair.
    min_overlap: 20
    # Trim bases that read past the opposite primer.
    trim_overhang: true
  asv:
    # De-novo error method: consensus or pooled.
    denovo_method: "consensus"
    # Banded-alignment band widths (max, min).
    band_size_max: 430
    band_size_min: 200
  output:
    # Output filename stems for the three DADA2 artefacts.
    taxa_prefix: "taxonomy"
    fasta_prefix: "asvs"
    seq_table_prefix: "seqtab_nochim"
  taxonomy:
    # Only keys that change the assignment itself belong here: this section is
    # what :dada2_assign_taxonomy hashes, so anything listed marks the stage
    # stale when it changes. Thread count moved to the top-level r_threads and
    # the SSH target to the top-level remote block for exactly that reason -
    # neither alters a single assignment. A project config may still spell
    # `multithread` and `remote` here and they keep working, but they are
    # deprecated and re-running on a different host or thread count no longer
    # invalidates work it could not have changed.
    # Minimum bootstrap confidence to keep an assignment; 0 keeps all.
    min_boot: 0
    # Run the taxonomy assignment stage.
    enabled: true
    # Reference database key, resolved against config/databases.
    database: "pr2"

## OTU clustering (SWARM)
# NB: chimera_check, fastq_minovlen, min_abundance and identity are not read by
# this pipeline; they are pinned in the local global config/pipeline.yml purely
# to preserve existing runs' stage hashes, and are omitted here on purpose.
swarm:
  # Run the SWARM OTU path.
  enabled: true
  # Local clustering resolution (SWARM -d).
  differences: 1
  # Worker threads; 0 lets SWARM choose.
  threads: 0
  # Extra raw SWARM flags appended verbatim.
  optional_args: ""

## Reference clustering (CD-HIT)
cdhit:
  # Run the CD-HIT dereplication path.
  enabled: false
  # Sequence identity threshold.
  identity: 0.97
  # Worker threads; 0 lets CD-HIT choose.
  threads: 0
  # Extra raw CD-HIT flags appended verbatim.
  optional_args: ""

## Reference-based classification (VSEARCH)
vsearch:
  # Run the VSEARCH classification path.
  enabled: true
  # Minimum identity to accept a database hit.
  identity: 0.75
  # Minimum fraction of the query covered by an alignment.
  query_cov: 0.8
  # Search cut-offs; ~ uses the VSEARCH defaults.
  maxaccepts: ~
  maxrejects: ~
  # Search strand: plus or both; ~ uses the VSEARCH default.
  strand: ~
  # Extra raw VSEARCH flags appended verbatim.
  optional_args: ""

## Taxonomy merge and tagging
# Post-classification table filters, given as filter files under config/filters;
# ~ applies none. Set per project (e.g. a host or off-target removal list).
merge_taxa: ~
tagging:
  # Taxonomy side that drives categorisation and rank labels: VSEARCH or DADA2.
  source: "VSEARCH"
  # Drop rows whose count of unresolved _X placeholders exceeds this; -1 keeps all.
  max_x: -1
  # Composition category sets (config/compositions) to materialise on tables.
  category_sets:
    - "default"

## Phylogenetic placement (MAFFT, trimAl, IQ-TREE, RAxML EPA, gappa)
# Reference trees are built on the Reference trees page and placements run from
# a study's Trees tab. Each reference tree and placement can override these
# settings for itself. Trimming and accumulation always run on this machine.
phylogeny:
  # Threads for MAFFT, IQ-TREE, RAxML and gappa on this machine.
  threads: 4
  # Building a reference tree.
  reference:
    align:
      # MAFFT method: auto, localpair (L-INS-i with maxiterate), genafpair
      # (E-INS-i), globalpair (G-INS-i) or 6merpair.
      strategy: "localpair"
      # Refinement iterations (--maxiterate); 0 omits it, auto ignores it.
      maxiterate: 1000
      # Extra raw MAFFT flags appended verbatim.
      optional_args: ""
    trim:
      # trimAl column selection: manual uses the thresholds below; gappyout,
      # strict, strictplus, automated1, nogaps and noallgaps are trimAl's own modes.
      method: "manual"
      # -gt: keep columns with residues in at least this fraction of sequences.
      gap_threshold: 0.3
      # -cons: keep at least this percentage of columns whatever the thresholds; ~ off.
      conservation: ~
      # -st: minimum average similarity of a kept column (0 to 1); ~ off.
      similarity_threshold: ~
      # -resoverlap and -seqoverlap, set together: remove sequences with fewer than
      # sequence_overlap percent of positions overlapping residue_overlap of the
      # column; ~ keeps every sequence.
      residue_overlap: ~
      sequence_overlap: ~
      # Extra raw trimAl flags appended verbatim.
      optional_args: ""
    tree:
      # IQ-TREE substitution model; MFP picks one with ModelFinder.
      model: "MFP"
      # Branch support: standard (-b) or ultrafast (-bb) bootstrap.
      bootstrap: "standard"
      # Bootstrap replicates; ultrafast needs at least 1000.
      replicates: 100
      # Extra raw IQ-TREE flags appended verbatim.
      optional_args: ""
  # Placing queries on a reference tree.
  placement:
    # MAFFT --addfragments onto the trimmed reference alignment.
    align:
      strategy: "auto"
      maxiterate: 0
      optional_args: ""
    trim:
      # trimAl column selection: manual uses the thresholds below; gappyout,
      # strict, strictplus, automated1, nogaps and noallgaps are trimAl's own modes.
      method: "manual"
      # -gt: keep columns with residues in at least this fraction of sequences.
      gap_threshold: 0.01
      # -cons: keep at least this percentage of columns whatever the thresholds; ~ off.
      conservation: ~
      # -st: minimum average similarity of a kept column (0 to 1); ~ off.
      similarity_threshold: ~
      # -resoverlap and -seqoverlap, set together: remove sequences with fewer than
      # sequence_overlap percent of positions overlapping residue_overlap of the
      # column; ~ keeps every sequence.
      residue_overlap: ~
      sequence_overlap: ~
      # Extra raw trimAl flags appended verbatim.
      optional_args: ""
    place:
      # RAxML substitution model (-m) for EPA.
      model: "GTRCATI"
      # EPA heuristic (-G): the fraction of branches tried in full; ~ tries all.
      heuristic: 0.2
      # Extra raw RAxML flags appended verbatim.
      optional_args: ""
    accumulate:
      # gappa --threshold: placement mass a branch must gather before a query
      # is assigned to it, from 0.5 to 1.
      threshold: 0.8

## Read QC reports
fastqc:
  # FastQC worker threads.
  threads: 20
  # Extra raw FastQC flags appended verbatim.
  optional_args: ""
multiqc:
  # Extra raw MultiQC flags appended verbatim.
  optional_args: ""

## Analysis and figures
analysis:
  # Composition categories to drop from figures, given as {set, category} pairs;
  # each names a set in config/composition.yml and one of its categories. Set to
  # [] to exclude nothing. The default drops everything the whitelist-based
  # 'contamination' set does not retain (see the eukaryome_whitelist filter in
  # config/composition.yml).
  # apply_to lists the chart surfaces the exclusion acts on: diversity (alpha,
  # NMDS, PERMANOVA), taxa (rank-tagged chart), composition (category-tagged
  # chart), venn, differential (differential abundance). Omit apply_to to act on
  # all surfaces. Composition is left out here so the composition chart still
  # shows the full make-up.
  exclude_categories:
    - set: contamination
      category: Contaminant
      apply_to: [diversity, taxa, venn, differential]
  # Alpha diversity: richness, Shannon and Simpson per sample.
  alpha:
    # How counts are normalised first: none, rarefy or srs. none uses the raw
    # counts, so a deeper sample can show more ASVs. rarefy subsamples each
    # sample to a common depth; srs (scaling with ranked subsampling) scales to
    # it instead. Both leave out samples below the depth.
    normalisation: none
    # Reads per sample for rarefy or srs; 0 uses the smallest non-empty sample.
    depth: 0
    # rarefy draws averaged for each value.
    rarefaction_iterations: 100
    # Overlay individual sample points on the boxplots.
    show_points: true
    # Annotate group-wise significance on the alpha comparison.
    annotate_significance: true
    # Draw pairwise significance brackets between groups.
    pairwise_brackets: true
    # Treat groups as paired in the significance test.
    paired_samples: true
    # Join each sample to itself across groups with a line, using the same
    # pairing the paired significance test uses.
    paired_lines: true
    # Significance test for the alpha comparison.
    significance_test: "kruskal_wallis"
  # Beta diversity: the Bray-Curtis dissimilarities behind NMDS and PERMANOVA.
  beta:
    # How counts are prepared: hellinger, none, rarefy or srs. hellinger takes
    # the square root of each sample's relative abundances, which puts samples
    # of any depth on one scale and damps the most abundant taxa.
    normalisation: hellinger
    # Reads per sample for rarefy or srs; 0 uses the smallest non-empty sample.
    depth: 0
  # Differential abundance: compares two conditions on the raw read counts, with
  # mandatory Benjamini-Hochberg adjusted p-values across the fitted family.
  differential:
    # The model fitted across the two conditions.
    # - nb_glm: negative-binomial GLM on read counts with a library-size offset;
    #   the effect is a log2 fold change.
    # - zinb / hurdle_nb: a zero/occurrence process plus a count process, tested
    #   jointly; the count-process fold change is reported and the zero-process
    #   effect stays in diagnostics.
    # - clr_welch: Welch's t-test on centred log-ratios over the taxa passing
    #   min_prevalence after zCompositions::cmultRepl zero replacement; the
    #   effect is a CLR difference, not a fold change.
    # - ancom_bc: bias-corrected log-linear model (Lin & Peddada 2020) that
    #   estimates sample-specific and between-group sampling-fraction shifts via
    #   an E-M Gaussian mixture; the effect is a bias-corrected log2 fold change.
    # - aldex2: Dirichlet(count + 0.5) Monte-Carlo CLR instances with consistent-sign
    #   Welch's t-test and Fernandes et al. (2014) standardized CLR effect size.
    # - songbird: compositional baseline-category multinomial regression with
    #   reference-frame invariant CLR-centred differentials (Morton et al. 2019;
    #   Zhang et al. 2017); the effect is a CLR log-ratio differential, not an
    #   absolute fold change.
    # - multinomial / dirichlet_multinomial: one joint fit of the whole
    #   composition, reported as log ratios against a reference taxon.
    method: nb_glm
    # How library size enters each model, as a log offset: tss (total reads per
    # sample) or rle (median-of-ratios over the taxa present in every sample).
    # rle is refused when no taxon is present in every sample.
    # Used by count models (nb_glm, zinb, hurdle_nb); clr_welch ignores it.
    offset: tss
    # nb_glm only: where each taxon's negative-binomial theta comes from. ml
    # (the default) takes the maximum-likelihood estimate MASS::glm.nb fits per
    # taxon. glmGamPoi takes the shrunken dispersion glmGamPoi::glm_gp fits
    # across all taxa in one call -- sharing information across taxa, which
    # steadies low-count taxa -- and fits each taxon through
    # MASS::negative.binomial(theta = 1/dispersion), so the Wald test is
    # unchanged. Requires the glmGamPoi R package; refused for non-nb_glm methods.
    dispersion: ml
    # Fraction of samples, 0 to 1, in which a taxon must have reads to be
    # tested. Taxa below it are listed as filtered, without a p-value. Applied
    # before compositional subcomposition construction in clr_welch, ancom_bc,
    # aldex2, and songbird. Bayesian replacement refuses a taxon seen in fewer
    # than 2 samples; CZM requires at least one.
    min_prevalence: 0.0
    # clr_welch only: how cmultRepl replaces zeros before the centred log-ratio.
    # bayesian_multiplicative uses the geometric Bayesian-multiplicative (GBM)
    # posterior replacement. multiplicative_replacement uses count zero
    # multiplicative (CZM) replacement. Both preserve observed-part ratios;
    # neither turns an imputed zero into a measurement.
    replacement_method: bayesian_multiplicative
    # clr_welch only: cmultRepl's frac, strictly between 0 and 1. For CZM this
    # is the fraction of the 0.5/sample-total threshold; for either method an
    # imputed proportion above its taxon's smallest observed proportion is
    # lowered to this fraction of it. Values below 0.01 or at least 0.9 warn.
    replacement_delta: 0.65
    # multinomial and dirichlet_multinomial only: the taxon whose log-odds are the
    # denominator of every reported log ratio. ~ picks the most abundant taxon that
    # passes min_prevalence. A reference must have reads in at least half the
    # samples: every ratio is anchored on it, so a sparse one makes them unstable.
    mn_reference_taxon: ~
    # multinomial and dirichlet_multinomial: L2 (ridge) penalty on the log-odds
    # coefficients, 0 for maximum likelihood. A penalty keeps a taxon with almost
    # no reads in one group from dominating the joint fit, and its standard errors
    # are the penalised ones. An L1 (Songbird-style sparsity) penalty is not
    # implemented: a lasso estimate has no valid Wald standard error.
    mn_penalty: 0.0
    # dirichlet_multinomial only: how the Dirichlet concentration is estimated.
    # mle profiles the likelihood alternately with the coefficients; mom takes one
    # method-of-moments estimate from the multinomial composition (faster, no
    # alternation). The result reports the concentration c and theta = 1/(1+c),
    # the model's intra-sample correlation; theta -> 0 is the multinomial.
    dm_overdispersion_method: mle
    # Optimiser settings for the two multinomial models, which are fitted in
    # Julia: the Newton iteration cap, the convergence tolerance (largest
    # coefficient update, relative to the coefficients), and the wall-clock
    # budget in seconds. A fit that exceeds the budget fails with an explicit
    # error rather than holding the request open. The dense observed information
    # limits a fit to 1000 taxa; raise min_prevalence or use a coarser rank above
    # that.
    max_iter: 500
    tolerance: 0.00000001
    max_seconds: 300.0
    # clr_welch with bayesian_multiplicative only: null uses GBM's estimated
    # Dirichlet concentration. A finite value greater than 0 overrides it with
    # cmultRepl(method = "user") and the same leave-one-out prior mean.
    bayesian_alpha: ~
    # aldex2 only: number of Dirichlet Monte-Carlo instances drawn per sample
    # (whole number in [16, 4096]; seeded by the study's top-level seed).
    mc_samples: 128

## Occupancy probe (MMW-01)
# Measures each attested stage's memory: Julia's allocation total, and the
# sampled resident memory of the tools it runs as child processes (Linux /proc).
# Recorded under the stage's `occupancy` key in attestation.yml. See the
# header of src/core/memory_probe.jl.
#
# Off unless set, and deliberately left commented out here: the run config is
# embedded in attestation.yml, so a default key would change every run's record
# even with the probe off. Set it by editing a pipeline.yml (the config editor
# only offers keys that have a factory default).
# occupancy_probe:
#   enabled: true
#   # Sampling interval in milliseconds (at least 1).
#   interval_ms: 10
