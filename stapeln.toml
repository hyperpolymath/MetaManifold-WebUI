# SPDX-License-Identifier: MPL-2.0
# stapeln.toml — layer-based container build for MetaManifold-WebUI.
#
# stapeln builds containers as composable layers (German: "to stack"). Each layer is
# independently cacheable, verifiable and signable.
#
# Owner ruling, 2026-09-26: the proof lane is to be STANDALONE DEPLOYABLE, not local-only —
# built here through the Guix environment and mise, and run in CI from the image rather than
# from whatever happens to be installed on a runner. `proofs/agda/README.md` is the manual for
# the lane itself; this file is how it is shipped.
#
# Layers, in dependency order:
#   base            Guix on Debian slim — the estate's reproducible toolchain lane
#   guix-toolchain  guix.scm resolved at the pinned channels.scm commit, which includes agda
#                   and agda-stdlib (see the proof-lane comment there)
#   mise-toolchain  mise.toml: julia 1.12.5, bun 1.3.10, node 20.20.2, just 1.43.1 — the
#                   exact pins CI uses, so the image and CI cannot drift
#   proofs          `just prove-agda` at build time: a build that cannot check the laws
#                   fails, which is the point of shipping them
#   runtime         the toolchain and a checkout-free entry point for `just prove-agda`
#
# What this file does NOT claim: that the image has been built. It has not — this sandbox has
# no container runtime and no network to a registry (see the PR body). The first CI run builds
# it, and until then the lane is `just prove-agda` on a machine with Agda.

[metadata]
name = "metamanifold-webui"
version = "0.1.0"
description = "MetaManifold-WebUI toolchain image (Julia, R lane, bun, Agda proofs)"
author = "Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"
license = "MPL-2.0"
registry = "ghcr.io/hyperpolymath"

[build]
containerfile = "Containerfile"
context = "."
runtime = "podman"

# ── Layers ────────────────────────────────────────────────────────────────────

[layers.base]
description = "Debian slim base; Guix is layered on rather than replacing the base so the R lane's system packages remain available"
from = "docker.io/library/debian:12-slim"
packages = ["ca-certificates", "curl", "xz-utils", "git", "bash", "locales", "gnupg"]
cache = true
verify = true

[layers.guix-toolchain]
description = "Guix resolved from channels.scm; guix.scm supplies julia, R, node, just, agda, agda-stdlib, cutadapt, multiqc, fastqc, vsearch, cd-hit"
extends = "base"
commands = [
    "git clone --depth 1 https://codeberg.org/guix/guix /opt/guix-src",
    "/opt/guix-src/etc/guix-install.sh --yes || true",
    "guix time-machine -C channels.scm -- shell -D -f guix.scm -- true",
    "guix time-machine -C channels.scm -- shell -D -f guix.scm -- agda --version",
]
cache-key = "channels.scm"
cache = true

[layers.mise-toolchain]
description = "mise pins the exact CI versions of julia, bun, node and just (mise.toml)"
extends = "guix-toolchain"
commands = [
    "curl -fsSL https://mise.run | bash",
    "/root/.local/bin/mise install",
    "/root/.local/bin/mise ls",
]
cache-key = "mise.toml"
cache = true

[layers.proofs]
description = "Build-time proof check: a checkout whose laws do not check does not become an image"
extends = "mise-toolchain"
commands = [
    "just -f Justfile prove-agda",
    "julia --project=no --startup-file=no scripts/kyaml/KYAML.jl --check",
]
artifacts = [
    { src = "proofs/agda/ZeroReplacement.agdai", dst = "/proofs/ZeroReplacement.agdai" },
    { src = "proofs/agda/NoRigidReplacement.agdai", dst = "/proofs/NoRigidReplacement.agdai" },
    { src = "proofs/agda/DispersionShrinkage.agdai", dst = "/proofs/DispersionShrinkage.agdai" },
]

[layers.runtime]
description = "Runtime: the toolchain plus the repository, so `just prove-agda` and `just check-kyaml` run without a checkout"
from = "docker.io/library/debian:12-slim"
packages = ["ca-certificates", "git", "bash"]
copy-from = [
    { layer = "proofs", src = "/proofs/", dst = "/proofs/" },
]
entrypoint = ["/usr/bin/env", "just", "prove-agda"]
user = "root"
env = { PATH = "/root/.local/share/mise/shims:/root/.local/bin:/usr/local/bin:/usr/bin:/bin", AGDA_DIR = "/root/.agda" }
