#
# Issue chooser configuration. Blank issues stay enabled so that reports
# which fit neither form are not silently discouraged.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/hyperpolymath/MetaManifold-WebUI/security/advisories/new
    about: Report privately via a security advisory. Do NOT open a public issue.
  - name: Application behaviour (pipeline, analyses, UI features)
    url: https://github.com/JoshuaJewell/MetaManifold-WebUI/issues
    about: Domain changes belong to upstream — file them there, not here.
