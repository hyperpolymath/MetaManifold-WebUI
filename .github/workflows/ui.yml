name: Stipple UI contracts

on:
  pull_request:
    paths: ['ui/**', '.github/workflows/ui.yml']
  push:
    branches: [main]
    paths: ['ui/**', '.github/workflows/ui.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32  # v3.0.2
        with:
          version: '1.12.5'
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8  # v3.3.0
      - name: Instantiate isolated UI environment
        run: julia --project=ui -e 'using Pkg; Pkg.instantiate()'
      - name: Test contracts and backend URL validation
        run: julia --compiled-modules=no --compile=min -O0 --project=ui ui/test/runtests.jl
