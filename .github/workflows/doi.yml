# SPDX-License-Identifier: MPL-2.0
name: DOI publication contracts

on:
  pull_request:
    paths: ['src/doi/**', 'src/server/**', 'src/analysis/AnalysisConfig.jl', 'test/doi/**', 'test/unit/test_doi*', 'scripts/link_doi.jl', 'config/schemas/doi*', 'config/templates/doi*', 'Project.toml', 'Manifest.toml', '.github/workflows/doi.yml']
  push:
    branches: [main, 'arena/**']
    paths: ['src/doi/**', 'src/server/**', 'src/analysis/AnalysisConfig.jl', 'test/doi/**', 'test/unit/test_doi*', 'scripts/link_doi.jl', 'config/schemas/doi*', 'config/templates/doi*', 'Project.toml', 'Manifest.toml', '.github/workflows/doi.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: DOI contracts (no credentials or live deposits)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32  # v3.0.2
        with:
          version: '1.12.5'
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8  # v3.3.0
      - name: Syntax and source dependency contracts
        run: julia --startup-file=no config/ci/lint_source.jl
      - name: Instantiate isolated HTTP-only test environment
        run: julia --project=test/doi -e 'using Pkg; Pkg.instantiate()'
      - name: Publication lifecycle, security, restart and failure contracts
        run: julia --project=test/doi test/doi/runtests.jl
      - name: Preserve resolved test environment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: doi-test-environment
          path: test/doi/Manifest.toml
          if-no-files-found: ignore
