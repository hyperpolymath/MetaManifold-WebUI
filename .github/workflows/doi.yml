name: DOI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Classify whether the change touches DOI publication files, mirroring the
  # main CI gate design. A push to main is always relevant.
  gate:
    name: DOI relevance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      relevant: ${{ steps.push.outputs.relevant || steps.pr.outputs.relevant }}
    steps:
      - name: A push to main is relevant
        if: github.event_name == 'push'
        id: push
        run: echo 'relevant=true' >> "$GITHUB_OUTPUT"

      - name: Checkout the change
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Does the change touch DOI files?
        if: github.event_name == 'pull_request'
        id: pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          relevant=false
          patterns=('src/core/doi.jl' 'src/server/routes/doi.jl' 'test/unit/test_doi.jl' 'CITATION.cff' 'docs/doi-publication.md' 'scripts/link-doi.sh' '.github/workflows/doi.yml')
          changed="$RUNNER_TEMP/doi-changed-files"
          if ! git diff --no-renames --name-only -z "$BASE_SHA...HEAD" > "$changed"; then
            echo "ERROR: git diff $BASE_SHA...HEAD failed" >&2
            exit 1
          fi
          while IFS= read -r -d '' file; do
            for pattern in "${patterns[@]}"; do
              case "$file" in $pattern) relevant=true; break 2 ;; esac
            done
          done < "$changed"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  # No credentials are required: this lane never calls Zenodo and never writes
  # to GitHub. It validates syntax, schema and shell hygiene only. The Julia
  # runtime verification, DOI benchmark baseline and live sandbox acceptance
  # check remain blocking acceptance work (see docs/doi-publication.md).
  lint:
    name: DOI lint
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Shell syntax check
        run: bash -n scripts/link-doi.sh

      - name: Citation metadata check
        run: |
          missing=()
          for key in cff-version title authors license; do
            grep -q "^${key}:" CITATION.cff || missing+=("${key}:")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "CITATION.cff missing required top-level keys: ${missing[*]}" >&2
            exit 1
          fi

      - name: Receipt schema shape
        run: |
          missing=()
          for key in schema study run origin deposition_id doi published files created_at published_at checksum; do
            if ! grep -qF -e "\"${key}\"" -e ":${key}" src/core/doi.jl; then
              missing+=("${key}")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "src/core/doi.jl missing receipt schema keys: ${missing[*]}" >&2
            exit 1
          fi
          echo "verified DOI receipt schema keys in src/core/doi.jl"

  # Julia lifecycle and real-HTTP checks require a provisioned machine with the
  # Julia runtime and are a documented blocking acceptance gate, not part of
  # this credential-free lane.
