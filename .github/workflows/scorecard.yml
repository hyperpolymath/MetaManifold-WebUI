# SPDX-License-Identifier: MPL-2.0
# Pinned reusable implementation; keep publication off pull requests.
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scorecard:
    # The default-branch SARIF upload needs security-events: write; never
    # expose that grant or the publication OIDC token to PR code.
    uses: metadatastician/standards/.github/workflows/scorecard-reusable.yml@c6d78606f3928c22c3b0bdc6f5f5b47b96e05a5d
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
