# SPDX-License-Identifier: MPL-2.0
# Pinned reusable implementation; keep publication off pull requests.
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scorecard:
    # The default-branch SARIF upload needs security-events: write; never
    # expose that grant or the publication OIDC token to PR code.
    #
    # Fork-local copy of the standards reusable at c6d78606: a reusable workflow
    # owned by another account is refused by this repository's Actions policy at
    # plan time, which left this lane dark after standards moved to
    # metadatastician on 2026-10-25.
    uses: ./.github/workflows/scorecard-reusable.yml
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
