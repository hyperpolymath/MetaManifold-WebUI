# SPDX-License-Identifier: MPL-2.0
# Full-history and working-tree secret scanning from the pinned estate reusable.
name: Secret Scanner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Secret history and working tree
    permissions:
      contents: read
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@75bd5994470661a099df562d6d5ad2fe744dbd66
    # Deliberately no secrets: the pinned reusable declares and needs none.
