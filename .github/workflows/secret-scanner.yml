# SPDX-License-Identifier: MPL-2.0
name: Secret Scanner

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Secret history and working tree
    # Full-history + working-tree gitleaks and shell-secret checks. The
    # reusable installs a checksum-verified binary; no action licence or
    # repository secrets are passed to code from a pull request.
    uses: ./.github/workflows/secret-scanner-reusable.yml
    permissions:
      contents: read
