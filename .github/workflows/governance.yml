#
# Fork governance lane. DEED and K9 conformance come from hyperpolymath/standards; the
# Hypatia verdict grid uses a fork-local copy of the standards reusable so its
# advisory PR scan cannot become a blocking code-scanning-results check. Both
# sources are pinned to commits. The grid covers Hypatia, panic-attack, pons
# asinorum and the gitbot-fleet report-backs under .gitbot-fleet/. This workflow
# is the fork's; nothing in it is proposed upstream, and upstream's ci.yml is
# untouched.
#
# The reusable renders the grid; the two jobs below post it on the pull
# request and publish the badges, because a called workflow may not request
# permissions its caller does not grant.
name: Governance (fork)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-contract:
    name: Advisory scan contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the advisory SARIF boundary
        run: |
          bash scripts/check-governance-contract.sh
          bash scripts/tests/test-governance-contract.sh
          bash scripts/tests/test-ci-logging.sh
          bash scripts/tests/test-k9-log-copy.sh
          bash scripts/tests/test-scanner-boundaries.sh

  deed:
    name: DEED syntax
    uses: hyperpolymath/standards/.github/workflows/deed-conformance.yml@75bd5994470661a099df562d6d5ad2fe744dbd66
    permissions:
      contents: read
    with:
      require-files: true

  k9:
    name: K9 conformance
    uses: ./.github/workflows/k9-conformance-reusable.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      # No K9 contracts are committed yet: report grey, never pretend that
      # DEED syntax validation establishes K9 semantic conformance.
      require-files: false
      fail-on-indeterminate: true

  hypatia:
    name: Hypatia verdict grid
    needs: [workflow-contract]
    # Fork-local so advisory PR scans do not upload error-level SARIF and
    # create a second blocking check. The source pin and deltas are documented
    # in the called file and checked by scripts/check-governance-contract.sh.
    uses: ./.github/workflows/hypatia-scan-reusable.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    secrets:
      HYPATIA_SCAN_PAT: ${{ secrets.HYPATIA_SCAN_PAT }}

  verdict:
    name: Post the verdict grid
    needs: [deed, k9, hypatia]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download the verdict grid
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verdict-grid
          path: verdict-grid

      - name: Download the K9 conformance grid
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: k9-grid
          path: k9-grid

      - name: Update the compact PR verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEED_RESULT: ${{ needs.deed.result }}
          K9_RESULT: ${{ needs.k9.result }}
          K9_VERDICT: ${{ needs.k9.outputs.verdict }}
          HYPATIA_RESULT: ${{ needs.hypatia.result }}
          HYPATIA_VERDICT: ${{ needs.hypatia.outputs.verdict }}
        run: |
          set -euo pipefail
          # The DEED lane is a conformance row: pass is green, failure red,
          # anything else (skipped, cancelled, no result) orange. The grid
          # itself comes from the artifact; a missing artifact is orange.
          case "$DEED_RESULT" in
            success) deed='🟢 conformant' ;;
            failure) deed='🔴 failing' ;;
            *)       deed="🟠 indeterminate ($DEED_RESULT)" ;;
          esac
          # A rendered grid is not proof that its job completed successfully.
          case "$K9_RESULT" in
            success) k9="${K9_VERDICT:-orange}" ;;
            failure) k9=red ;;
            *)       k9=orange ;;
          esac
          {
            echo '<!-- fork-governance-verdict: regenerated on every run -->'
            echo '# Fork governance'
            echo
            echo "| Lane | Status | Run |"
            echo "|---|---|---|"
            echo "| DEED syntax (repo deed) | $deed | [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
            echo "| K9 conformance (L0–L2; L3 not verified) | $k9 (job: $K9_RESULT) | same run |"
            echo "| Hypatia verdict grid | ${HYPATIA_VERDICT:-orange} (job: $HYPATIA_RESULT) | same run |"
            echo
            if [ -s verdict-grid/report.md ]; then
              cat verdict-grid/report.md
            else
              echo '🟠 indeterminate · no verdict-grid artifact was produced by the Hypatia lane; see the run.'
            fi
            echo
            if [ -s k9-grid/report.md ]; then
              cat k9-grid/report.md
            else
              echo '🟠 indeterminate · no K9 grid artifact was produced; see the run.'
            fi
          } > "$RUNNER_TEMP/body.md"
          # One comment per PR, updated in place; newest run wins.
          comment_id=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            | jq -r '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- fork-governance-verdict:")))] | last | .id // ""')
          jq -n --rawfile body "$RUNNER_TEMP/body.md" '{body: $body}' > "$RUNNER_TEMP/comment.json"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --input "$RUNNER_TEMP/comment.json" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$RUNNER_TEMP/comment.json" >/dev/null
          fi
          echo "published the governance verdict to #$PR_NUMBER"

  badges:
    name: Publish badges
    needs: [deed, hypatia]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the verdict grid
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verdict-grid
          path: verdict-grid

      - name: Write the badge endpoints and push the governance-badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEED_RESULT: ${{ needs.deed.result }}
        run: |
          set -euo pipefail
          # shields.io endpoint JSON, one file per lane, on an orphan branch
          # that holds nothing else. README badges read them through
          # img.shields.io/endpoint. A lane without a result publishes orange.
          mkdir -p out
          case "$DEED_RESULT" in
            success) msg=conformant; colour=brightgreen ;;
            failure) msg=failing; colour=red ;;
            *)       msg=indeterminate; colour=orange ;;
          esac
          jq -n --arg m "$msg" --arg c "$colour" '{schemaVersion: 1, label: "DEED syntax", message: $m, color: $c}' > out/deed.json
          if [ -s verdict-grid/badge.json ]; then
            cp verdict-grid/badge.json out/hypatia-grid.json
          else
            jq -n '{schemaVersion: 1, label: "Hypatia grid", message: "indeterminate", color: "orange"}' > out/hypatia-grid.json
          fi
          [ -s verdict-grid/report.json ] && cp verdict-grid/report.json out/hypatia-grid.report.json
          cd out
          git init -q -b governance-badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "badges: $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" governance-badges
          echo "published badge endpoints for $GITHUB_SHA"
