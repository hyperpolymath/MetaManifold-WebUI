#
# Manual-dispatch lane for the null-calibration comparators that need compiled
# Bioconductor packages (bench/null_calibration, issue #193 follow-up #261).
#
# The bench itself never runs automatically. The measurement environment it
# cannot get locally -- native R with glmGamPoi and edgeR -- is exactly the one
# this repository already provisions for CI (.github/workflows/ci.yml, "Set up
# R" + renv::restore). This lane reuses those scripts rather than restating
# them, so the R version and the package pins are the repository's, not a
# second copy that can drift.
#
# Why dispatch-only:
#   * it is slow and stochastic, so it must never gate a push or a PR;
#   * it installs edgeR, which is NOT in renv.lock. edgeR is an outside
#     reference for the bench (calibration.R documents this), never an app
#     dependency, so it is installed into the system library here and its
#     version is recorded in the provenance file every cell writes.
#
# Results are returned two ways, because neither is guaranteed on every
# repository: the summary CSVs are committed back to the branch that dispatched
# the run (contents: write), and are also emitted as annotations, which the
# checks API serves even where the job log is unavailable.
name: Null-calibration comparators (manual)

on:
  workflow_dispatch:
    inputs:
      n_per:
        description: "Samples per group, comma separated"
        required: true
        default: "4,12"
        type: string
      sims:
        description: "Simulations per cell"
        required: true
        default: "1000"
        type: string
      taxa:
        description: "Taxa per dataset"
        required: true
        default: "40"
        type: string
      tests:
        description: "Comma-separated tests"
        required: true
        default: "wald_ml,lrt,ql_f,glmgampoi_ql,edger_ql,wald_trend"
        type: string
      commit_results:
        description: "Commit the summary CSVs back to the dispatched branch"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  comparators:
    name: glmGamPoi and edgeR cells
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      R_LIBS_SITE: /usr/local/lib/R/site-library:/usr/lib/R/site-library:/usr/lib/R/library
    steps:
      - name: Check out the dispatched branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The results commit needs the token; nothing else in this job writes.
          persist-credentials: true

      # The repository's one reviewed place for tool pins (yq by tag and asset
      # SHA-256, the standards and ijson-jcs checkers by exact commit).
      - name: Install pinned tools
        run: bash scripts/ci/fetch-statistics-tools.sh

      # YAML-POLICY Y-1: the pin is read by a parser, never by grep.
      - name: Read the pinned R version
        run: |
          R_APT_VERSION="$(yq -r '.runtimes.r.apt_version' config/defaults/tool_versions.yml)"
          BIOC_VERSION="$(yq -r '.runtimes.r.bioconductor' config/defaults/tool_versions.yml)"
          echo "R_APT_VERSION=$R_APT_VERSION" >> "$GITHUB_ENV"
          echo "BIOC_VERSION=$BIOC_VERSION" >> "$GITHUB_ENV"

      # Same script, same pin, same trust anchor as the CI jobs.
      - name: Set up R
        run: bash scripts/ci/install-r-runtime.sh full

      # MASS and glmGamPoi come from the committed lockfile; restoring it is
      # what makes this the repository's environment rather than a fresh one.
      - name: Restore R packages from renv.lock
        run: |
          set -euo pipefail
          sudo Rscript --no-init-file -e 'if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv", repos = "https://cloud.r-project.org", lib = .Library)'
          sudo Rscript --no-init-file -e 'renv::restore(project = ".", library = .Library, prompt = FALSE)'
          Rscript --no-init-file -e 'for (pkg in c("MASS", "glmGamPoi")) if (!requireNamespace(pkg, quietly = TRUE)) stop(pkg, " is missing after renv::restore")'

      # edgeR is an outside reference only and deliberately absent from
      # renv.lock, so it is installed here against the pinned Bioconductor
      # release. If it cannot be installed this job fails rather than silently
      # running without one of the requested comparators.
      - name: Install edgeR from the pinned Bioconductor release
        run: |
          set -euo pipefail
          sudo Rscript --no-init-file -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))
            if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager", lib = .Library)
            BiocManager::install(version = Sys.getenv("BIOC_VERSION"), ask = FALSE, update = FALSE, lib = .Library)
            BiocManager::install("edgeR", ask = FALSE, update = FALSE, lib = .Library)
            if (!requireNamespace("edgeR", quietly = TRUE)) stop("edgeR failed to install")
            cat("edgeR", as.character(packageVersion("edgeR")), "\n")'

      - name: Record the environment
        run: |
          Rscript --no-init-file -e 'cat(R.version.string, "\n"); for (p in c("MASS","glmGamPoi","edgeR")) cat(p, as.character(packageVersion(p)), "\n")'

      # --out/--results are passed explicitly: the default paths are relative to
      # the repository root, which is this step's working directory.
      - name: Run the comparator cells
        env:
          NB_N_PER: ${{ inputs.n_per }}
          NB_SIMS: ${{ inputs.sims }}
          NB_TAXA: ${{ inputs.taxa }}
          NB_TESTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          Rscript --no-init-file bench/null_calibration/calibration.R \
            --shapes=original --offsets=tss \
            --n-per="$NB_N_PER" --sims="$NB_SIMS" --taxa="$NB_TAXA" \
            --tests="$NB_TESTS" --truth=null

      - name: Summarise
        run: Rscript --no-init-file bench/null_calibration/summarise.R

      - name: Publish the summaries as annotations
        if: always()
        run: |
          set -uo pipefail
          for csv in bench/null_calibration/results/calibration_summary.csv \
                     bench/null_calibration/results/provenance_summary.csv; do
            [ -f "$csv" ] || continue
            name="$(basename "$csv")"
            # Annotations cap at 4096 bytes each, so the file is split and each
            # chunk is one notice. %/CR are escaped as the checks API expects.
            split -b 3000 -d "$csv" "$RUNNER_TEMP/annot-"
            index=0
            for chunk in "$RUNNER_TEMP"/annot-*; do
              index=$((index + 1))
              body="$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$chunk" | awk '{printf "%s%%0A", $0}')"
              echo "::notice title=${name} part ${index}::${body}"
            done
          done

      # A results commit is evidence, not a code change: it touches only the
      # bench's results directory. Failure to push must not lose the run, so the
      # job reports it and stays green through the annotations above.
      - name: Commit the summary CSVs back to the dispatched branch
        if: always() && inputs.commit_results
        continue-on-error: true
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/null_calibration/results
          if git diff --cached --quiet; then
            echo "no results change to commit"
            exit 0
          fi
          git commit -m "bench(null_calibration): comparator cells from ${RUN_URL}

          Produced by the manual-dispatch lane, not by hand. Cells, seeds, executor
          and package versions are in results/provenance_summary.csv."
          git push origin "HEAD:${BRANCH}"

      - name: Retain the raw cells
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: null-calibration-raw
          path: |
            bench/null_calibration/results/raw
            bench/null_calibration/results/*.csv
          if-no-files-found: warn
          retention-days: 30
