#
# Weekly measurement of branch drift, reported in ONE rolling issue.
#
# On 2026-10-25 the remote held fifteen heads: `main`, a data branch the badge
# publisher force-pushes (`governance-badges`), and thirteen others that were
# either already contained in `main` or cut from a snapshot between 5 and 119
# commits old. Every one of those thirteen had an open pull request, and every
# pull request started a full CI run. The cost was not the storage; it was that
# a genuinely fresh change could not be told apart from a fortnight-old one
# without running this comparison by hand.
#
# The reporting shape is deliberate: one issue, updated in place, closed when
# the branches are gone. A scheduled job that opens an issue every week is the
# mechanism that produced the pile it is meant to clear.
name: Branch hygiene

on:
  schedule:
    # Mondays, after the Scorecard and secret-scanner slots.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  triage:
    name: Triage remote branches
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ROLLING_TITLE: 'Branch hygiene: drifted and superseded branches'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Triage every remote head against main
        id: triage
        run: |
          set -euo pipefail
          bash scripts/maintenance/triage-branches.sh \
            --base main --remote origin --format markdown > "$RUNNER_TEMP/branches.md"
          cat "$RUNNER_TEMP/branches.md" >> "$GITHUB_STEP_SUMMARY"
          # The script's own summary lines are the count; grep the classes
          # rather than re-deriving them, so there is one definition.
          stale="$(grep -c '^| .* | stale |' "$RUNNER_TEMP/branches.md" || true)"
          salvage="$(grep -c '^| .* | salvage |' "$RUNNER_TEMP/branches.md" || true)"
          {
            printf 'stale=%s\n' "${stale:-0}"
            printf 'salvage=%s\n' "${salvage:-0}"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert the rolling issue
        env:
          STALE: ${{ steps.triage.outputs.stale }}
          SALVAGE: ${{ steps.triage.outputs.salvage }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- branch-hygiene:rolling -->'
          existing="$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$ROLLING_TITLE\") | .number" | head -1)"

          if [ "${STALE:-0}" -eq 0 ] && [ "${SALVAGE:-0}" -eq 0 ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "No drifted or superseded branch was found on $(date -u +%Y-%m-%d). Closing."
              gh issue close "$existing" --reason completed
            fi
            echo 'No drifted branches; nothing to report.'
            exit 0
          fi

          {
            printf '%s\n' "$marker"
            printf 'Branches on `origin` measured against `main` on %s.\n\n' "$(date -u +%Y-%m-%d)"
            printf 'Classes are defined in [docs/maintenance/repository-hygiene.md](%s/blob/main/docs/maintenance/repository-hygiene.md) and produced by `scripts/maintenance/triage-branches.sh`.\n\n' "$REPO_URL"
            cat "$RUNNER_TEMP/branches.md"
            printf '\nGenerated by [branch hygiene run](%s). This issue is updated in place and closes itself when the branches are gone.\n' "$RUN_URL"
          } > "$RUNNER_TEMP/issue.md"

          gh label create hygiene --force \
            --description 'Repository maintenance work' --color ededed >/dev/null 2>&1 || true

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/issue.md"
            echo "Updated issue #$existing"
          else
            gh issue create --title "$ROLLING_TITLE" --body-file "$RUNNER_TEMP/issue.md" --label hygiene
          fi
