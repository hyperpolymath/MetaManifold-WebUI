#
# Fork governance lane. The DEED, K9 and Hypatia lanes and the comment poster
# call metadatastician/standards directly, all at one full commit SHA (owner
# decision, 2026-11-10). The Actions policy of this repository must permit
# `metadatastician/standards/.github/workflows/*@*` for those calls to start.
# The Hypatia lane is advisory on pull requests: it does not upload SARIF
# there, so its scan cannot become a blocking code-scanning-results check.
# The grid covers Hypatia, panic-attack, pons
# asinorum and the gitbot-fleet report-backs under .gitbot-fleet/. This workflow
# is the fork's; nothing in it is proposed upstream, and upstream's ci.yml is
# untouched.
#
# The lanes render their grids and ask for no write permission. The standards
# posting engine writes the one pull-request comment, and the badges job
# publishes the badge endpoints on a push to main.
name: Governance (fork)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-contract:
    name: Advisory scan contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the advisory SARIF boundary
        run: |
          bash scripts/check-governance-contract.sh
          bash scripts/tests/test-governance-contract.sh
          bash scripts/tests/test-ci-logging.sh
          bash scripts/tests/test-scanner-boundaries.sh
          # Branch triage and the pull-request freshness rule: the scripts the
          # hygiene workflows run, tested where every other shell test runs.
          bash scripts/tests/test-triage-branches.sh
          bash scripts/tests/test-check-pr-freshness.sh

  deed:
    name: DEED syntax
    # The standards lane, called directly. If the Actions policy stops
    # permitting metadatastician/standards, this run fails at plan time with
    # zero jobs and no error line in any check summary: read the workflow page.
    # The K9 lane below must keep the same pin; the contract check enforces it.
    uses: metadatastician/standards/.github/workflows/deed-conformance.yml@d73229d8220a35f66e99678966797dd6399dda1f
    permissions:
      contents: read
    with:
      require-files: true

  k9:
    name: K9 conformance
    uses: metadatastician/standards/.github/workflows/k9-conformance.yml@d73229d8220a35f66e99678966797dd6399dda1f
    permissions:
      contents: read
      pull-requests: read
    with:
      # Require the committed .machine_readable/contractiles/ K9 corpus across
      # L0–L2; an accidentally emptied corpus or orange state fails closed.
      require-files: true
      fail-on-indeterminate: true

  # The previous governance comment of this pull request, for the "Since
  # previous revision" column of the Hypatia grid. Only a comment written by
  # github-actions[bot] is read. The Hypatia lane itself asks for no
  # pull-request permission, so this job reads the comment and hands it over as
  # an artifact. A missing artifact leaves the column without a comparison.
  previous-grid:
    name: Capture previous bot-authored Hypatia grid
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Read previous trusted comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/grid-previous.md"
          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
               > "$RUNNER_TEMP/grid-comments.json"; then
            echo "::warning::Cannot read prior PR comments; historical comparison unavailable."
          elif ! jq -e 'type == "array" and all(.[]; type == "array")' "$RUNNER_TEMP/grid-comments.json" >/dev/null; then
            echo "::warning::Malformed PR comments response; historical comparison unavailable."
          else
            jq -r '[.[][] | select((.user.login // "") == "github-actions[bot]"
                     and ((.body // "") | contains("<!-- verdict-grid:hypatia ")))]
                     | last | .body // ""' "$RUNNER_TEMP/grid-comments.json" \
              > "$RUNNER_TEMP/grid-previous.md"
            if [ -s "$RUNNER_TEMP/grid-previous.md" ]; then
              echo "Trusted prior Hypatia PR grid captured."
            else
              echo "::notice::No previous bot-authored Hypatia grid for this PR."
            fi
          fi

      - name: Upload previous PR grid evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hypatia-grid-previous
          path: ${{ runner.temp }}/grid-previous.md
          if-no-files-found: error
          retention-days: 7

  # Fleet report-backs, produced before the Hypatia lane renders so each enrolled
  # gitbot-fleet member's row (.gitbot-fleet/enrolment.json) carries evidence
  # instead of "enrolled, but no report-back was received". Same owner
  # (hyperpolymath), so the reusable is allowed by this repository's Actions
  # policy; scripts/check-governance-contract.sh guards the pin and the wiring.
  fleet:
    name: Fleet report-backs
    needs: [workflow-contract]
    uses: hyperpolymath/gitbot-fleet/.github/workflows/fleet-report-back-reusable.yml@7fc27784a66a71a54e10e4b2f9b59476ecae0887
    permissions:
      contents: read

  hypatia:
    name: Hypatia verdict grid
    # After the fleet job whatever its result (a dead fleet job renders as orange
    # fleet rows, never as a missing lane), but never after a failed contract.
    # previous-grid is skipped on a push; a skipped need does not stop this job.
    needs: [workflow-contract, fleet, previous-grid]
    if: ${{ !cancelled() && needs.workflow-contract.result == 'success' }}
    # The standards lane, called directly at the same commit as the DEED and K9
    # lanes. Two opt-in inputs keep the two behaviours the fork-local copy
    # existed for; scripts/check-governance-contract.sh guards both.
    uses: metadatastician/standards/.github/workflows/hypatia-scan-reusable.yml@d73229d8220a35f66e99678966797dd6399dda1f
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # This lane is advisory on pull requests. An upload there creates a
      # separate, blocking "Code scanning results / Hypatia" check even when
      # the scan job passes. Push and manual runs still upload.
      sarif-upload-on-pull-request: false
      # The TypeScript files this fork received from upstream. Only the
      # banned-language finding on these exact paths is excused; the grid
      # still reports each one as excluded. The contract check ties the list
      # to the audited upstream snapshot.
      inherited-language-paths: config/hypatia/upstream-typescript-allowlist.txt
      # This repository has no frozen archive tree.
      scope-excludes: ""
      previous-grid-artifact: ${{ github.event_name == 'pull_request' && 'hypatia-grid-previous' || '' }}
    secrets:
      HYPATIA_SCAN_PAT: ${{ secrets.HYPATIA_SCAN_PAT }}

  verdict:
    name: Post the fork governance summary
    needs: [deed, k9, hypatia]
    if: ${{ always() && github.event_name == 'pull_request' }}
    # The standards posting engine: one comment, in the order that
    # 3-practice/fork-governance/SPEC.adoc fixes. canon-ref names the renderer
    # commit and must equal the lane pin.
    uses: metadatastician/standards/.github/workflows/fork-governance-reusable.yml@d73229d8220a35f66e99678966797dd6399dda1f
    permissions:
      contents: read
      actions: read
      pull-requests: write
    with:
      pr-number: ${{ github.event.pull_request.number }}
      deed-result: ${{ needs.deed.result }}
      k9-result: ${{ needs.k9.result }}
      k9-verdict: ${{ needs.k9.outputs.verdict }}
      hypatia-result: ${{ needs.hypatia.result }}
      hypatia-verdict: ${{ needs.hypatia.outputs.verdict }}
      hypatia-advisory: ${{ needs.hypatia.outputs.advisory }}
      canon-ref: d73229d8220a35f66e99678966797dd6399dda1f

  badges:
    name: Publish badges
    needs: [deed, k9, hypatia]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the K9 conformance grid
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: k9-grid
          path: k9-grid

      - name: Download the verdict grid
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verdict-grid
          path: verdict-grid

      - name: Write the badge endpoints and push the governance-badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEED_RESULT: ${{ needs.deed.result }}
          K9_RESULT: ${{ needs.k9.result }}
        run: |
          set -euo pipefail
          # shields.io endpoint JSON, one file per lane, on an orphan branch
          # that holds nothing else. README badges read them through
          # img.shields.io/endpoint. A lane without a result publishes orange.
          mkdir -p out
          case "$DEED_RESULT" in
            success) msg=conformant; colour=brightgreen ;;
            failure) msg=failing; colour=red ;;
            *)       msg=indeterminate; colour=orange ;;
          esac
          jq -n --arg m "$msg" --arg c "$colour" '{schemaVersion: 1, label: "DEED syntax", message: $m, color: $c}' > out/deed.json
          if [ "$K9_RESULT" = "success" ] && [ -s k9-grid/badge.json ]; then
            cp k9-grid/badge.json out/k9-grid.json
          elif [ "$K9_RESULT" = "failure" ]; then
            jq -n '{schemaVersion: 1, label: "K9 contracts", message: "failing", color: "red"}' > out/k9-grid.json
          else
            jq -n '{schemaVersion: 1, label: "K9 contracts", message: "indeterminate", color: "orange"}' > out/k9-grid.json
          fi
          [ -s k9-grid/report.json ] && cp k9-grid/report.json out/k9-grid.report.json
          if [ -s verdict-grid/badge.json ]; then
            cp verdict-grid/badge.json out/hypatia-grid.json
          else
            jq -n '{schemaVersion: 1, label: "Hypatia grid", message: "indeterminate", color: "orange"}' > out/hypatia-grid.json
          fi
          [ -s verdict-grid/report.json ] && cp verdict-grid/report.json out/hypatia-grid.report.json
          cd out
          git init -q -b governance-badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "badges: $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" governance-badges
          echo "published badge endpoints for $GITHUB_SHA"
